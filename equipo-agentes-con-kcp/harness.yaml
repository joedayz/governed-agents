# kcp-harness configuration
version: "1.0"

governance:
  domains:
    - manifest: "./knowledge.yaml"
      paths:
        - "docs/"
        - "skills/"
        - "salidas/"

  policy:
    fail_closed: true
    audit_all: true
    max_units: 5
    strict: false

  # Cualquier escritura fuera de salidas/ queda fuera del action_scope
  # declarado por executor-skill y es denegada en runtime, no solo en el
  # papel: esta es la frontera de seguridad del skill.
  approvals:
    provider: file
    dir: .kcp-harness/approvals
    rules:
      - match: { tools: [write_file], paths: ["docs/", "skills/"] }
        required_role: coordinador-clinico
        expires_after: 72h
        policy_ref: EQUIPO-AGENTES-1
    # budget:
    #   amount: 1.00
    #   currency: USDC
    # context_budget: 50000
    # env: prod
    # signature_required: true
    # trusted_keys:
    #   - "./keys/manifest-key.pem"

  # Confidence gate — harness_assess adjudicates an answer's confidence
  # against this threshold before it may be acted on; failures route to
  # the named approval role when set
  # confidence:
  #   threshold: 0.7
  #   severity: critical
  #   route_to_role: account-owner
  #   expires_after: 72h
  #   policy_ref: POL-9.1

  # Conformance-gate routing — an out-of-scope action under an active skill
  # routes to this role/policy instead of borrowing confidence's above
  # (absent = falls back to confidence, then a hardcoded default)
  # conformance:
  #   route_to_role: account-owner
  #   expires_after: 24h
  #   policy_ref: POL-9.2

  # Human-approval gates — calls matching a rule are held for a named
  # reviewer (resolve with: kcp-harness approvals approve <id> ...)
  # approvals:
  #   provider: file
  #   dir: .kcp-harness/approvals
  #   rules:
  #     - match: { tools: [Write, Edit], paths: [records/] }
  #       required_role: account-owner
  #       expires_after: 72h
  #       policy_ref: POL-7.2

downstream:
